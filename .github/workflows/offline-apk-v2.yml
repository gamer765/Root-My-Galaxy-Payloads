name: Build offline Root My Galaxy APK

on:
  push:
    branches:
      - offline-app-build-v3
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout payload repository
        uses: actions/checkout@v4
        with:
          path: payloads

      - name: Checkout upstream app
        uses: actions/checkout@v4
        with:
          repository: BuSung-dev/Root-My-Galaxy
          ref: main
          path: appsrc

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare offline app
        shell: bash
        run: |
          set -euo pipefail
          python3 payloads/offline-app/prepare_offline_build.py
          ! grep -q 'android.permission.INTERNET' appsrc/app/src/main/AndroidManifest.xml

      - name: Build APK
        working-directory: appsrc
        shell: bash
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Package outputs
        shell: bash
        run: |
          set -euo pipefail
          P="$(git -C payloads rev-parse --short=12 HEAD)"
          A="$(git -C appsrc rev-parse --short=12 HEAD)"
          mkdir -p dist
          cp appsrc/app/build/outputs/apk/debug/app-debug.apk "dist/Root-My-Galaxy-Offline-${P}.apk"
          cp appsrc/app/src/main/assets/offline/artifact-index.json dist/artifact-index.json
          sha256sum dist/*.apk > dist/SHA256SUMS.txt
          printf 'payload_repo_commit=%s\nupstream_app_commit=%s\n' "$P" "$A" > dist/BUILD-INFO.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: root-my-galaxy-offline
          path: dist/
          if-no-files-found: error
          compression-level: 0
