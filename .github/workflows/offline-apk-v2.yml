name: Build offline Root My Galaxy APK v2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/offline-apk-v2.yml"
      - "support/targets-v3.json"
      - "artifacts/**"
      - "kernelsu/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout payload repository
        uses: actions/checkout@v4
        with:
          path: payloads

      - name: Checkout upstream app
        uses: actions/checkout@v4
        with:
          repository: BuSung-dev/Root-My-Galaxy
          ref: main
          path: appsrc

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-37" \
            "build-tools;37.0.0" \
            "cmake;3.22.1" \
            "ndk;28.2.13676358"

      - name: Build offline source tree
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import pathlib
          import re
          import shutil

          root = pathlib.Path.cwd()
          payload_repo = root / "payloads"
          app = root / "appsrc"
          manifest_path = payload_repo / "support" / "targets-v3.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          if manifest.get("schemaVersion") != 3:
              raise SystemExit("Expected schemaVersion 3")

          prefix = "https://raw.githubusercontent.com/gamer765/Root-My-Galaxy-Payloads/main/"
          asset_root = app / "app" / "src" / "main" / "assets" / "offline"
          (asset_root / "support").mkdir(parents=True, exist_ok=True)
          shutil.copy2(manifest_path, asset_root / "support" / "targets-v3.json")

          copied = {}
          for profile in manifest["payloads"]:
              for key in ("exploit", "kernelsu"):
                  item = profile[key]
                  url = item["url"]
                  if not url.startswith(prefix):
                      raise SystemExit(f"Unexpected artifact URL: {url}")
                  rel = url[len(prefix):]
                  if not rel or ".." in pathlib.PurePosixPath(rel).parts:
                      raise SystemExit(f"Unsafe artifact path: {rel}")
                  src = payload_repo / rel
                  if not src.is_file():
                      raise SystemExit(f"Missing artifact: {rel}")
                  expected = int(item["size"])
                  actual = src.stat().st_size
                  if actual != expected:
                      raise SystemExit(f"Size mismatch: {rel}: {actual} != {expected}")
                  if rel in copied:
                      continue
                  dst = asset_root / rel
                  dst.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(src, dst)
                  copied[rel] = actual

          (asset_root / "build-info.json").write_text(
              json.dumps({
                  "mode": "offline",
                  "artifactCount": len(copied),
                  "bundledBytes": sum(copied.values()),
                  "artifacts": copied,
              }, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          gradle = app / "app" / "build.gradle.kts"
          g = gradle.read_text(encoding="utf-8")
          g = re.sub(r'applicationId\s*=\s*"dev\.busung\.s25uroot"',
                     'applicationId = "dev.busung.s25uroot.offline"', g, count=1)
          g = re.sub(r'versionName\s*=\s*"([^"]+)"',
                     lambda m: f'versionName = "{m.group(1)}-offline"', g, count=1)
          if 'ndkVersion = "28.2.13676358"' not in g:
              g = g.replace("compileSdk = 37",
                            'compileSdk = 37\n    ndkVersion = "28.2.13676358"', 1)
          gradle.write_text(g, encoding="utf-8")

          android_manifest = app / "app" / "src" / "main" / "AndroidManifest.xml"
          a = android_manifest.read_text(encoding="utf-8")
          a = re.sub(r'\s*<uses-permission android:name="android\.permission\.INTERNET"\s*/>\s*',
                     "\n", a, count=1)
          android_manifest.write_text(a, encoding="utf-8")

          strings = app / "app" / "src" / "main" / "res" / "values" / "strings.xml"
          s = strings.read_text(encoding="utf-8")
          for old, new in {
              '<string name="app_name">Root My Galaxy</string>': '<string name="app_name">Root My Galaxy Offline</string>',
              'The app will verify the support profile, then download and run the exploit and KernelSU payload from GitHub.': 'The app will verify the support profile, then load and run the bundled offline exploit and KernelSU payload.',
              '<string name="step_download_title">Download</string>': '<string name="step_download_title">Payloads</string>',
              '<string name="step_download_detail">Load the support manifest</string>': '<string name="step_download_detail">Load bundled manifest and payloads</string>',
              '<string name="phase_downloading">Downloading commit-pinned payloads from GitHub</string>': '<string name="phase_downloading">Loading bundled offline payloads</string>',
              '<string name="status_checking_github">Checking GitHub support manifest</string>': '<string name="status_checking_github">Checking bundled support manifest</string>',
              '<string name="status_downloading_payload">Downloading payloads</string>': '<string name="status_downloading_payload">Loading bundled payloads</string>',
              '<string name="log_download_verified">[+] Payload download complete</string>': '<string name="log_download_verified">[+] Bundled payloads verified</string>',
              '<string name="repo_downloading">Downloading %1$s</string>': '<string name="repo_downloading">Loading bundled %1$s</string>',
              '<string name="repo_incomplete">%1$s download is incomplete</string>': '<string name="repo_incomplete">Bundled %1$s is incomplete</string>',
              '<string name="updater_check">Check for updates</string>': '<string name="updater_check">Offline build — update check unavailable</string>',
          }.items():
              s = s.replace(old, new)
          strings.write_text(s, encoding="utf-8")

          repo = app / "app" / "src" / "main" / "java" / "dev" / "busung" / "s25uroot" / "PayloadRepository.kt"
          repo.write_text('''package dev.busung.s25uroot

import android.content.Context
import android.system.Os
import java.io.File
import java.io.FileOutputStream

data class VerifiedPayloads(
    val profile: TargetProfile,
    val exploit: File,
    val kernelSu: File,
)

class PayloadRepository(private val context: Context) {
    fun loadTargets(): List<TargetProfile> {
        val bytes = context.assets.open(MANIFEST_ASSET).use { it.readBytes() }
        return SupportManifest.parse(bytes).targets
    }

    fun resolveTarget(snapshot: DeviceSnapshot): TargetProfile = loadTargets()
        .firstOrNull { it.matches(snapshot) }
        ?: error(context.getString(R.string.repo_no_profile))

    fun resolveTarget(profileId: String): TargetProfile = loadTargets()
        .firstOrNull { it.profileId == profileId }
        ?: error(context.getString(R.string.repo_profile_missing, profileId))

    fun download(profile: TargetProfile, onProgress: (String) -> Unit): VerifiedPayloads {
        val directory = File(context.filesDir, "payloads/${profile.profileId}").apply { mkdirs() }
        val exploit = copyArtifact(
            profile.exploit,
            File(directory, "cve-2026-43499-app.so"),
            context.getString(R.string.artifact_exploit),
            onProgress,
        )
        val kernelSu = copyArtifact(
            profile.kernelSu,
            File(directory, "ksud-s25u-kdp"),
            context.getString(R.string.artifact_kernelsu),
            onProgress,
        )
        Os.chmod(exploit.absolutePath, 0b100100100)
        Os.chmod(kernelSu.absolutePath, 0b100100100)
        return VerifiedPayloads(profile, exploit, kernelSu)
    }

    private fun copyArtifact(
        artifact: RemoteArtifact,
        destination: File,
        label: String,
        onProgress: (String) -> Unit,
    ): File {
        onProgress(context.getString(R.string.repo_downloading, label))
        val temporary = File(destination.parentFile, "${destination.name}.part")
        if (temporary.exists()) temporary.delete()
        var total = 0L
        context.assets.open(assetPath(artifact.url)).use { input ->
            FileOutputStream(temporary).use { output ->
                val buffer = ByteArray(DEFAULT_BUFFER_SIZE)
                while (true) {
                    val count = input.read(buffer)
                    if (count < 0) break
                    total += count
                    require(total <= artifact.size) {
                        context.getString(R.string.repo_size_exceeded, label)
                    }
                    output.write(buffer, 0, count)
                }
                output.fd.sync()
            }
        }
        require(total == artifact.size) { context.getString(R.string.repo_incomplete, label) }
        if (destination.exists()) destination.delete()
        require(temporary.renameTo(destination)) {
            context.getString(R.string.repo_finalize_failed, label)
        }
        onProgress(context.getString(R.string.repo_verified, label))
        return destination
    }

    private fun assetPath(url: String): String {
        require(url.startsWith(SOURCE_PREFIX)) { context.getString(R.string.repo_url_invalid) }
        val relative = url.removePrefix(SOURCE_PREFIX)
        require(relative.isNotBlank() && relative.split('/').none { it == ".." }) {
            context.getString(R.string.repo_url_invalid)
        }
        return "offline/$relative"
    }

    companion object {
        private const val MANIFEST_ASSET = "offline/support/targets-v3.json"
        private const val SOURCE_PREFIX =
            "https://raw.githubusercontent.com/gamer765/Root-My-Galaxy-Payloads/main/"
    }
}
''', encoding="utf-8")

          print(f"Bundled {len(copied)} unique artifacts ({sum(copied.values())} bytes)")
          PY

          PAYLOAD_COMMIT="$(git -C payloads rev-parse HEAD)"
          APP_COMMIT="$(git -C appsrc rev-parse HEAD)"
          printf 'payload_repo=gamer765/Root-My-Galaxy-Payloads@%s\napp_repo=BuSung-dev/Root-My-Galaxy@%s\n' \
            "$PAYLOAD_COMMIT" "$APP_COMMIT" \
            > appsrc/app/src/main/assets/offline/source-commits.txt
          ! grep -q 'android.permission.INTERNET' appsrc/app/src/main/AndroidManifest.xml
          grep -q 'dev.busung.s25uroot.offline' appsrc/app/build.gradle.kts

      - name: Build APK
        working-directory: appsrc
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Package outputs
        shell: bash
        run: |
          set -euo pipefail
          P="$(git -C payloads rev-parse --short=12 HEAD)"
          A="$(git -C appsrc rev-parse --short=12 HEAD)"
          mkdir -p dist
          cp appsrc/app/build/outputs/apk/debug/app-debug.apk "dist/Root-My-Galaxy-Offline-${P}.apk"
          tar --exclude='appsrc/.git' --exclude='appsrc/.gradle' --exclude='appsrc/app/build' \
            -czf "dist/Root-My-Galaxy-Offline-source-${P}.tar.gz" appsrc
          sha256sum dist/* > dist/SHA256SUMS.txt
          printf 'payload_repo_commit=%s\nupstream_app_commit=%s\n' "$P" "$A" > dist/BUILD-INFO.txt
          cat dist/SHA256SUMS.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: root-my-galaxy-offline
          path: dist/
          if-no-files-found: error
          compression-level: 0
