name: Build ZZI4 pure KernelSU Next test pair

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/zzi4-ksunext-rebuild.yml"
      - "Makefile"
      - "src/slide_app.c"
      - "kernelsu/patches/KernelSU-Next-v3.3.0-samsung-kdp-rkp-defex.patch"
      - "src/targets/e3q-S928USQU6ZZI4/**"
  workflow_dispatch:

permissions:
  contents: write

env:
  KSU_COMMIT: 3b18216f71df189ab3d1b1ce0bdb21be1268e771
  TARGET_RELEASE: 6.1.162-android14-11-34343818-abS928USQU6ZZI4
  TARGET_KMI: android14-6.1
  MODULE_NAME: android14-6.1_kernelsu-e3q-S928USQU6ZZI4-kdp.ko
  DAEMON_NAME: ksud-e3q-S928USQU6ZZI4-kdp-ksun-3.3.0

jobs:
  build-module:
    name: Build pure KernelSU Next ZZI4 module
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ylarod/ddk-min:android14-6.1-20260313
      options: --privileged
    steps:
      - name: Checkout payload repository
        uses: actions/checkout@v4

      - name: Build module from exact KernelSU Next kernel source
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          KSU_ROOT="$RUNNER_TEMP/ksunext-module"
          git clone https://github.com/KernelSU-Next/KernelSU-Next.git "$KSU_ROOT"
          git config --global --add safe.directory "$KSU_ROOT"
          git -C "$KSU_ROOT" checkout --detach "$KSU_COMMIT"
          test "$(git -C "$KSU_ROOT" rev-parse HEAD)" = "$KSU_COMMIT"

          # The Samsung compatibility layer is applied only to the checked-out
          # KernelSU Next kernel tree. No userspace patch or prebuilt module is used.
          git -C "$KSU_ROOT" apply --whitespace=nowarn --include='kernel/**' \
            "$GITHUB_WORKSPACE/kernelsu/patches/KernelSU-Next-v3.3.0-samsung-kdp-rkp-defex.patch"
          bad_files="$(git -C "$KSU_ROOT" status --porcelain | sed -E 's/^.. //' | grep -v '^kernel/' || true)"
          if [[ -n "$bad_files" ]]; then
            printf 'unexpected non-kernel changes after patching:\n%s\n' "$bad_files"
            exit 1
          fi

          test -n "${KDIR:-}"
          test -f "$KDIR/Makefile"
          test -f "$KDIR/include/generated/utsrelease.h"
          test -f "$KDIR/include/config/kernel.release"

          sed -i -E 's|^#define UTS_RELEASE ".*"|#define UTS_RELEASE "'"$TARGET_RELEASE"'"|' \
            "$KDIR/include/generated/utsrelease.h"
          printf '%s\n' "$TARGET_RELEASE" > "$KDIR/include/config/kernel.release"
          grep -Fq "$TARGET_RELEASE" "$KDIR/include/generated/utsrelease.h"
          grep -Fq "$TARGET_RELEASE" "$KDIR/include/config/kernel.release"

          cd "$KSU_ROOT/kernel"
          set +e
          make -C "$KDIR" \
            M="$KSU_ROOT/kernel" \
            src="$KSU_ROOT/kernel" \
            modules \
            -j"$(nproc)" \
            KERNELRELEASE="$TARGET_RELEASE" \
            CONFIG_KSU=m \
            CONFIG_KSU_SAMSUNG_KDP=y \
            CONFIG_KSU_SAMSUNG_RKP=y \
            CONFIG_KSU_SAMSUNG_DEFEX=y \
            CONFIG_KSU_SAMSUNG_NO_PATCH_TEXT=y \
            SKIP_BTF=1 \
            KCFLAGS="-fno-stack-protector" \
            CC=clang
          build_rc=$?
          set -e
          if [[ "$build_rc" -ne 0 && ! -s kernelsu.ko ]]; then
            exit "$build_rc"
          fi

          test -s kernelsu.ko
          llvm-strip -d kernelsu.ko
          llvm-readelf -p .modinfo kernelsu.ko > /tmp/zzi4-modinfo.txt
          llvm-readelf -SW kernelsu.ko > /tmp/zzi4-sections.txt
          llvm-nm -a kernelsu.ko > /tmp/zzi4-symbols.txt

          grep -Fq "$TARGET_RELEASE" /tmp/zzi4-modinfo.txt
          grep -Eq '__versions.* 000000 ' /tmp/zzi4-sections.txt
          this_module_line="$(grep 'gnu.linkonce.this_module ' /tmp/zzi4-sections.txt || true)"
          printk_index_line="$(grep '\.printk_index ' /tmp/zzi4-sections.txt || true)"
          grep -Eq ' [A-Za-z] do_get_version_tag$' /tmp/zzi4-symbols.txt
          grep -Eq ' [A-Za-z] ksu_avc_spoof_enable$' /tmp/zzi4-symbols.txt
          grep -Eq ' [A-Za-z] ksu_samsung_kdp_init$' /tmp/zzi4-symbols.txt
          grep -Eq ' [A-Za-z] ksu_samsung_defex_init$' /tmp/zzi4-symbols.txt

          mkdir -p "$GITHUB_WORKSPACE/out"
          install -m 0644 kernelsu.ko "$GITHUB_WORKSPACE/out/$MODULE_NAME"
          sha256sum "$GITHUB_WORKSPACE/out/$MODULE_NAME" > "$GITHUB_WORKSPACE/out/MODULE-SHA256SUM"
          {
            echo "KernelSU Next commit: $KSU_COMMIT"
            echo "Target release: $TARGET_RELEASE"
            echo "Target KMI: $TARGET_KMI"
            echo "Kernel source: KernelSU Next kernel/"
            echo "Samsung compatibility scope: kernel-only KDP/RKP/DEFEX layer"
            echo "Samsung no-patch-text mode: CONFIG_KSU_SAMSUNG_NO_PATCH_TEXT=y"
            echo "Module section audit: this_module=$this_module_line"
            echo "Module section audit: printk_index=$printk_index_line"
            echo "Userspace source: not involved in module build"
            echo "Module provenance: freshly built from Next source; no prebuilt module copied"
            echo "Support feed: not enabled; hardware validation pending"
            cat "$GITHUB_WORKSPACE/out/MODULE-SHA256SUM"
          } > "$GITHUB_WORKSPACE/out/MODULE-BUILD-REPORT.txt"

      - name: Upload pure KernelSU Next module for audit
        uses: actions/upload-artifact@v4
        with:
          name: zzi4-kernelsu-next-pure-module
          path: out/

  build-daemon:
    name: Build pure KernelSU Next ksud
    needs: build-module
    runs-on: ubuntu-latest
    steps:
      - name: Checkout payload repository
        uses: actions/checkout@v4

      - name: Download pure KernelSU Next module
        uses: actions/download-artifact@v4
        with:
          name: zzi4-kernelsu-next-pure-module
          path: out

      - name: Install host build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential clang lld llvm

      - name: Install Android NDK r29
        run: |
          set -euo pipefail
          NDK_ROOT="$RUNNER_TEMP/android-ndk-r29"
          ARCHIVE="$RUNNER_TEMP/android-ndk-r29-linux.zip"
          curl --fail --location --retry 3 --retry-delay 2 \
            --output "$ARCHIVE" \
            "https://dl.google.com/android/repository/android-ndk-r29-linux.zip"
          unzip -q -o "$ARCHIVE" -d "$RUNNER_TEMP"
          test -x "$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
          echo "ANDROID_NDK_ROOT=$NDK_ROOT" >> "$GITHUB_ENV"


      - name: Rebuild legacy S928 ZZI4 app payload
        run: |
          set -euo pipefail
          make TARGET=e3q-S928USQU6ZZI4 ANDROID_NDK_HOME="$ANDROID_NDK_ROOT" stable
          built="build/e3q-S928USQU6ZZI4/cve-2026-43499-app.stable.so"
          payload="artifacts/e3q-S928USQU6ZZI4/cve-2026-43499-app-diagnostic.so"
          test "$(stat -c %s "$built")" -eq 104128
          llvm-readelf -h "$built" | grep -Fq "AArch64"
          strings "$built" | grep -Fq "S928 route result=0"
          install -m 0644 "$built" "$payload"
          sha256sum "$payload"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Fetch exact KernelSU Next userspace source
        run: |
          set -euo pipefail
          KSU_ROOT="$RUNNER_TEMP/ksunext-userspace"
          git clone https://github.com/KernelSU-Next/KernelSU-Next.git "$KSU_ROOT"
          git config --global --add safe.directory "$KSU_ROOT"
          git -C "$KSU_ROOT" checkout --detach "$KSU_COMMIT"
          test "$(git -C "$KSU_ROOT" rev-parse HEAD)" = "$KSU_COMMIT"

          # Apply the Next userspace portion of the S928 compatibility patch.
          # This keeps late-load synchronous: the staged daemon is moved into
          # /data/adb/ksud before module loading changes this process context.
          git -C "$KSU_ROOT" apply --whitespace=nowarn \
            --include='userspace/ksud/src/late_load.rs' \
            --include='userspace/ksud/src/utils.rs' \
            "$GITHUB_WORKSPACE/kernelsu/patches/KernelSU-Next-v3.3.0-samsung-kdp-rkp-defex.patch"

          # This is a build-metadata-only adjustment to Next build.rs.
          python3 - "$KSU_ROOT/userspace/ksud/build.rs" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          source = path.read_text()
          function_needle = "fn get_git_version() -> Result<(u32, String), std::io::Error> {\n"
          function_prefix = """fn get_git_version() -> Result<(u32, String), std::io::Error> {
              match (env::var("KSU_BUILD_VERSION_CODE"), env::var("KSU_BUILD_VERSION_NAME")) {
                  (Ok(code), Ok(name)) => {
                      let code = code.parse::<u32>().expect("Invalid KSU_BUILD_VERSION_CODE");
                      if code == 0 || name.trim().is_empty() {
                          panic!("Invalid KernelSU Next build metadata");
                      }
                      return Ok((code, name));
                  }
                  (Err(env::VarError::NotPresent), Err(env::VarError::NotPresent)) => {}
                  _ => panic!("Set both KernelSU Next build metadata variables"),
              }
          """
          if source.count(function_needle) != 1:
              raise SystemExit("unexpected KernelSU Next build.rs layout")
          source = source.replace(function_needle, function_prefix, 1)

          main_needle = "fn main() {\n"
          main_prefix = (
              'fn main() {\n'
              '    println!("cargo:rerun-if-env-changed=KSU_BUILD_VERSION_CODE");\n'
              '    println!("cargo:rerun-if-env-changed=KSU_BUILD_VERSION_NAME");\n'
          )
          if source.count(main_needle) != 1:
              raise SystemExit("unexpected KernelSU Next build.rs main layout")
          source = source.replace(main_needle, main_prefix, 1)
          path.write_text(source)
          PY

          cargo_toml="$KSU_ROOT/userspace/ksud/Cargo.toml"
          python3 - "$cargo_toml" "$KSU_ROOT/userspace/ksud/Cargo.lock" "$KSU_ROOT/userspace/ksuinit/Cargo.toml" <<'PY'
          from pathlib import Path
          import sys

          cargo_toml = Path(sys.argv[1])
          cargo_lock = Path(sys.argv[2])
          ksuinit_toml = Path(sys.argv[3])
          source = cargo_toml.read_text()
          old_java = 'java-properties = { git = "https://github.com/Kernel-SU/java-properties.git", branch = "master", default-features = false }'
          new_java = 'java-properties = { version = "=2.0.0", default-features = false }'
          if source.count(old_java) != 1:
              raise SystemExit("unexpected java-properties dependency declaration")
          source = source.replace(old_java, new_java, 1)

          old_props = "https://github.com/Kernel-SU/ksu_props"
          new_props = "https://github.com/ReSukiSU/ksu_props"
          if source.count(old_props) != 1:
              raise SystemExit("unexpected ksu_props dependency declaration")
          cargo_toml.write_text(source.replace(old_props, new_props, 1))

          lock_source = cargo_lock.read_text()
          if old_props not in lock_source:
              raise SystemExit("ksu_props source missing from Cargo.lock")
          cargo_lock.write_text(lock_source.replace(old_props, new_props))
          init_source = ksuinit_toml.read_text()
          old_rustix = "https://github.com/Kernel-SU/rustix.git"
          new_rustix = "https://github.com/ReSukiSU/rustix.git"
          if init_source.count(old_rustix) != 1:
              raise SystemExit("unexpected rustix dependency declaration")
          ksuinit_toml.write_text(init_source.replace(old_rustix, new_rustix, 1))

          lock_source = cargo_lock.read_text()
          if old_rustix not in lock_source:
              raise SystemExit("rustix source missing from Cargo.lock")
          cargo_lock.write_text(lock_source.replace(old_rustix, new_rustix))
          PY

          export CARGO_NET_GIT_FETCH_WITH_CLI=true
          cargo update --manifest-path "$cargo_toml" -p java-properties --precise 2.0.0

          changed_paths="$(git -C "$KSU_ROOT" status --porcelain | sed -E 's/^.. //')"
          bad_paths="$(printf '%s\n' "$changed_paths" | grep -Ev '^(userspace/ksud/(Cargo.lock|Cargo.toml|build.rs|src/late_load.rs|src/utils.rs)|userspace/ksuinit/Cargo.toml)$' || true)"
          if [[ -n "$bad_paths" ]]; then
            printf 'unexpected userspace changes after patching:\n%s\n' "$bad_paths"
            exit 1
          fi
          for expected_path in userspace/ksud/Cargo.lock userspace/ksud/Cargo.toml userspace/ksud/build.rs userspace/ksud/src/late_load.rs userspace/ksud/src/utils.rs userspace/ksuinit/Cargo.toml; do
            printf '%s\n' "$changed_paths" | grep -Fxq "$expected_path"
          done

      - name: Verify and embed freshly built Next module
        run: |
          set -euo pipefail
          KSU_ROOT="$RUNNER_TEMP/ksunext-userspace"
          module="$GITHUB_WORKSPACE/out/$MODULE_NAME"
          test -s "$module"
          llvm-readelf -p .modinfo "$module" | grep -Fq "$TARGET_RELEASE"
          llvm-readelf -SW "$module" | grep -Eq '__versions.* 000000 '
          module_sections="$(llvm-readelf -SW "$module")"
          llvm-nm -a "$module" | grep -Eq ' [A-Za-z] ksu_samsung_kdp_init$'
          llvm-nm -a "$module" | grep -Eq ' [A-Za-z] ksu_samsung_defex_init$'
          mkdir -p "$KSU_ROOT/userspace/ksud/bin/aarch64"
          install -m 0644 "$module" \
            "$KSU_ROOT/userspace/ksud/bin/aarch64/android14-6.1_kernelsu.ko"

      - name: Build KernelSU Next 3.3.0 daemon
        env:
          KSU_BUILD_VERSION_CODE: "33214"
          KSU_BUILD_VERSION_NAME: "3.3.0"
        run: |
          set -euo pipefail
          KSU_ROOT="$RUNNER_TEMP/ksunext-userspace"
          NDK="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64"
          export PATH="$NDK/bin:$PATH"
          export BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android="--sysroot=$NDK/sysroot -I$NDK/sysroot/usr/include/aarch64-linux-android -I$NDK/sysroot/usr/include"
          export CC_aarch64_linux_android="$NDK/bin/aarch64-linux-android35-clang"
          export CXX_aarch64_linux_android="$NDK/bin/aarch64-linux-android35-clang++"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$NDK/bin/aarch64-linux-android35-clang"
          export CARGO_NET_GIT_FETCH_WITH_CLI=true
          cargo build --locked --target aarch64-linux-android --release \
            --manifest-path "$KSU_ROOT/userspace/ksud/Cargo.toml"
          mkdir -p dist
          cp "$KSU_ROOT/userspace/ksud/target/aarch64-linux-android/release/ksud" \
            "dist/$DAEMON_NAME"

      - name: Verify pure Next daemon and embedded module provenance
        run: |
          set -euo pipefail
          daemon="dist/$DAEMON_NAME"
          module="$GITHUB_WORKSPACE/out/$MODULE_NAME"
          file "$daemon"
          test "$(stat -c %s "$daemon")" -gt 3000000
          strings "$daemon" | grep -Fq 'KernelSU Next'
          strings "$daemon" | grep -Fq 'com.rifsxd.ksunext'
          strings "$daemon" | grep -Fq '332143.3.0'
          strings "$daemon" | grep -Fq 'Failed to stage ksud'
          strings "$daemon" | grep -Fq 'Failed to finish ksud installation'
          if strings "$daemon" | grep -Fq 'Restarting KernelSU Next Manager'; then
            echo "daemon still contains the old asynchronous late-load restart path"
            exit 1
          fi
          if strings "$daemon" | grep -Eiq 'KernelSU-v3\.2\.5|3\.2\.5|legacy-s928|regular-module'; then
            echo "daemon contains forbidden non-Next lineage marker"
            exit 1
          fi
          if strings "$module" | grep -Eiq 'KernelSU-v3\.2\.5|3\.2\.5|legacy-s928|regular-module'; then
            echo "module contains forbidden non-Next lineage marker"
            exit 1
          fi

          python3 - "$daemon" "$module" <<'PY'
          import hashlib
          import struct
          import sys
          import zlib
          from pathlib import Path

          daemon = Path(sys.argv[1]).read_bytes()
          expected = hashlib.sha256(Path(sys.argv[2]).read_bytes()).hexdigest()
          if daemon[:6] != b"\x7fELF\x02\x01":
              raise SystemExit("daemon is not ELF64")
          shoff = struct.unpack_from("<Q", daemon, 40)[0]
          entsize, count, names_index = struct.unpack_from("<HHH", daemon, 58)
          headers = [struct.unpack_from("<IIQQQQIIQQ", daemon, shoff + i * entsize)
                     for i in range(count)]
          names_header = headers[names_index]
          names = daemon[names_header[4]:names_header[4] + names_header[5]]
          rodata = next(
              h for h in headers
              if names[h[0]:].split(b"\0", 1)[0] == b".rodata"
          )
          start, end = rodata[4], rodata[4] + rodata[5]
          found = []
          offset = start
          while offset < end:
              if (daemon[offset] >> 1) & 3 == 3:
                  offset += 1
                  continue
              try:
                  probe = zlib.decompressobj(-15).decompress(
                      daemon[offset:offset + 256], 16
                  )
              except zlib.error:
                  offset += 1
                  continue
              if not probe.startswith(b"\x7fELF\x02\x01"):
                  offset += 1
                  continue
              decoder = zlib.decompressobj(-15)
              try:
                  asset = decoder.decompress(daemon[offset:end], 32 * 1024 * 1024)
              except zlib.error:
                  offset += 1
                  continue
              if not decoder.eof:
                  offset += 1
                  continue
              consumed = end - offset - len(decoder.unused_data)
              elf_type = struct.unpack_from("<H", asset, 16)[0]
              if elf_type == 1:
                  found.append(hashlib.sha256(asset).hexdigest())
              offset += consumed
          if found != [expected]:
              raise SystemExit(f"embedded module mismatch: {found!r} != {[expected]!r}")
          print(f"embedded Next module matches {expected}")
          PY

          exploit="artifacts/e3q-S928USQU6ZZI4/cve-2026-43499-app-diagnostic.so"
          test -s "$exploit"
          cp "$exploit" dist/cve-2026-43499-app.so
          sha256sum "$daemon" "$module" "$exploit" > dist/SHA256SUMS
          patch_sha="$(sha256sum kernelsu/patches/KernelSU-Next-v3.3.0-samsung-kdp-rkp-defex.patch | cut -d' ' -f1)"
          {
            echo "KernelSU Next commit: $KSU_COMMIT"
            echo "Target release: $TARGET_RELEASE"
            echo "Target KMI: $TARGET_KMI"
            echo "Kernel compatibility scope: kernel-only Samsung KDP/RKP/DEFEX patch"
            echo "Userspace scope: exact Next late-load with synchronous S928 staging patch"
            echo "Userspace metadata scope: build.rs version override only"
            echo "Userspace dependency compatibility: registry java-properties; exact ksu_props and rustix commits via public mirrors"
            echo "Samsung patch file SHA-256: $patch_sha"
            echo "Exploit route: legacy S928 pselect path with timeout-compatible gate and failure diagnostics"
            echo "Support feed: publication pending final verification"
            echo "Publication: pending final app-feed commit"
            cat dist/SHA256SUMS
          } > dist/BUILD-REPORT.txt

      - name: Publish verified ZZI4 pair through the app feed
        run: |
          set -euo pipefail
          module="out/$MODULE_NAME"
          daemon="dist/$DAEMON_NAME"
          exploit="artifacts/e3q-S928USQU6ZZI4/cve-2026-43499-app-diagnostic.so"

          test -s "$module"
          test -s "$daemon"
          test -s "$exploit"
          module_sha="$(awk '{print $1}' out/MODULE-SHA256SUM)"
          test "$(sha256sum "$module" | awk '{print $1}')" = "$module_sha"
          daemon_size="$(stat -c %s "$daemon")"
          exploit_size="$(stat -c %s "$exploit")"
          test "$exploit_size" -eq 104128

          install -m 0644 "$module" "kernelsu/$MODULE_NAME"
          install -m 0755 "$daemon" "kernelsu/$DAEMON_NAME"

          python3 - "support/targets-v3.json" "$daemon_size" "$exploit_size" <<'PY'
          import json
          import sys
          from pathlib import Path

          feed_path = Path(sys.argv[1])
          daemon_size = int(sys.argv[2])
          exploit_size = int(sys.argv[3])
          feed = json.loads(feed_path.read_text())
          payload_id = "e3q-S928USQU6ZZI4"
          entry = {
              "payloadId": payload_id,
              "displayName": "Galaxy S24 Ultra SM-S928U1 | ZZI4 | Kernel 6.1.162 | KernelSU Next 3.3.0",
              "models": ["SM-S928U1"],
              "kernelVersions": ["6.1.162"],
              "exploit": {
                  "url": "https://raw.githubusercontent.com/gamer765/Root-My-Galaxy-Payloads/main/artifacts/e3q-S928USQU6ZZI4/cve-2026-43499-app-diagnostic.so",
                  "size": exploit_size
              },
              "kernelsu": {
                  "url": "https://raw.githubusercontent.com/gamer765/Root-My-Galaxy-Payloads/main/kernelsu/ksud-e3q-S928USQU6ZZI4-kdp-ksun-3.3.0",
                  "size": daemon_size
              }
          }
          payloads = [
              item for item in feed["payloads"]
              if item.get("payloadId") != payload_id
          ]
          insert_at = next(
              (
                  index + 1
                  for index, item in enumerate(payloads)
                  if item.get("payloadId") == "e3q-S928USQU6ZZHL"
              ),
              len(payloads)
          )
          payloads.insert(insert_at, entry)
          feed["payloads"] = payloads
          feed_path.write_text(json.dumps(feed, indent=2) + "\n")
          PY

          python3 - "dist/BUILD-REPORT.txt" <<'PY'
          import sys
          from pathlib import Path

          report_path = Path(sys.argv[1])
          report = report_path.read_text()
          report = report.replace(
              "Support feed: publication pending final verification",
              "Support feed: exact SM-S928U1 + kernel 6.1.162 automatic test match"
          )
          report = report.replace(
              "Publication: pending final app-feed commit",
              "Publication: GitHub raw downloads configured for the app test feed"
          )
          report_path.write_text(report)
          PY

          install -m 0644 dist/BUILD-REPORT.txt "kernelsu/BUILD-REPORT-e3q-S928USQU6ZZI4.txt"
          install -m 0644 dist/SHA256SUMS "kernelsu/SHA256SUMS-e3q-S928USQU6ZZI4.txt"

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            artifacts/e3q-S928USQU6ZZI4/cve-2026-43499-app-diagnostic.so \
            "kernelsu/$MODULE_NAME" \
            "kernelsu/$DAEMON_NAME" \
            kernelsu/BUILD-REPORT-e3q-S928USQU6ZZI4.txt \
            kernelsu/SHA256SUMS-e3q-S928USQU6ZZI4.txt \
            support/targets-v3.json
          if git diff --cached --quiet; then
            echo "The verified ZZI4 pair and exact app-feed entry are already published."
          else
            git commit -m "Publish ZZI4 S928 route-gate fix for app testing"
            git push origin HEAD:main
          fi

      - name: Upload pure Next test pair
        uses: actions/upload-artifact@v4
        with:
          name: zzi4-kernelsu-next-pure-pair
          path: dist/
