name: Build Root My Galaxy Offline APK v4

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/offline-apk-v4.yml"
      - "support/targets-v3.json"
      - "artifacts/**"
      - "kernelsu/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: root-my-galaxy-offline-v4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build offline APK with KernelSU Next
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout payload repository
        uses: actions/checkout@v4
        with:
          path: payloads

      - name: Checkout upstream Root My Galaxy
        uses: actions/checkout@v4
        with:
          repository: BuSung-dev/Root-My-Galaxy
          ref: main
          path: appsrc

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 cmake;3.22.1"
          accept-android-sdk-licenses: true

      - name: Set up NDK r28
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fetch latest KernelSU Next manager
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import pathlib
          import re
          import urllib.request

          api = "https://api.github.com/repos/KernelSU-Next/KernelSU-Next/releases/latest"
          request = urllib.request.Request(
              api,
              headers={
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "Root-My-Galaxy-Offline-Builder",
              },
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              release = json.load(response)

          candidates = []
          pattern = re.compile(r"^KernelSU_Next_v.*_\d+-release\.apk$")
          for asset in release.get("assets", []):
              name = asset.get("name", "")
              if pattern.match(name) and "spoofed" not in name.lower():
                  candidates.append(asset)

          if len(candidates) != 1:
              names = [a.get("name") for a in release.get("assets", [])]
              raise SystemExit(
                  f"Expected exactly one standard KernelSU Next manager APK; found {len(candidates)}. Assets: {names}"
              )

          asset = candidates[0]
          manager_dir = pathlib.Path("payloads/.offline-manager")
          manager_dir.mkdir(parents=True, exist_ok=True)
          manager_apk = manager_dir / "KernelSU-Next.apk"

          download = urllib.request.Request(
              asset["browser_download_url"],
              headers={"User-Agent": "Root-My-Galaxy-Offline-Builder"},
          )
          digest = hashlib.sha256()
          with urllib.request.urlopen(download, timeout=180) as response, manager_apk.open("wb") as output:
              while True:
                  chunk = response.read(1024 * 1024)
                  if not chunk:
                      break
                  digest.update(chunk)
                  output.write(chunk)

          actual_sha256 = digest.hexdigest()
          published_digest = asset.get("digest") or ""
          if published_digest:
              algorithm, _, expected = published_digest.partition(":")
              if algorithm.lower() != "sha256" or expected.lower() != actual_sha256:
                  raise SystemExit(
                      f"KernelSU Next manager digest mismatch: published={published_digest} actual=sha256:{actual_sha256}"
                  )

          metadata = {
              "repository": "KernelSU-Next/KernelSU-Next",
              "release": release.get("tag_name"),
              "releaseName": release.get("name"),
              "asset": asset["name"],
              "size": manager_apk.stat().st_size,
              "sha256": actual_sha256,
              "publishedDigest": published_digest,
              "sourceUrl": asset["browser_download_url"],
          }
          (manager_dir / "manager.json").write_text(
              json.dumps(metadata, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(metadata, indent=2))
          PY

      - name: Convert upstream app to fully offline build
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import pathlib
          import re
          import shutil

          root = pathlib.Path.cwd()
          payload_repo = root / "payloads"
          app = root / "appsrc"
          manifest_path = payload_repo / "support" / "targets-v3.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          if manifest.get("schemaVersion") != 3:
              raise SystemExit("Expected support manifest schemaVersion 3")

          source_prefix = "https://raw.githubusercontent.com/gamer765/Root-My-Galaxy-Payloads/main/"
          asset_root = app / "app" / "src" / "main" / "assets" / "offline"
          asset_root.mkdir(parents=True, exist_ok=True)

          copied = {}
          for profile in manifest["payloads"]:
              for key in ("exploit", "kernelsu"):
                  item = profile[key]
                  url = item["url"]
                  if not url.startswith(source_prefix):
                      raise SystemExit(f"Unexpected artifact URL for {profile['payloadId']}: {url}")
                  rel = url[len(source_prefix):]
                  parts = pathlib.PurePosixPath(rel).parts
                  if not rel or ".." in parts:
                      raise SystemExit(f"Unsafe artifact path: {rel}")
                  src = payload_repo / rel
                  if not src.is_file():
                      raise SystemExit(f"Missing artifact: {rel}")
                  expected = int(item["size"])
                  actual = src.stat().st_size
                  if actual != expected:
                      raise SystemExit(
                          f"Size mismatch for {profile['payloadId']} {key}: {rel}: {actual} != {expected}"
                      )
                  if rel not in copied:
                      dst = asset_root / rel
                      dst.parent.mkdir(parents=True, exist_ok=True)
                      shutil.copy2(src, dst)
                      copied[rel] = actual

          support_dir = asset_root / "support"
          support_dir.mkdir(parents=True, exist_ok=True)
          shutil.copy2(manifest_path, support_dir / "targets-v3.json")

          manager_src = payload_repo / ".offline-manager" / "KernelSU-Next.apk"
          manager_metadata_src = payload_repo / ".offline-manager" / "manager.json"
          if not manager_src.is_file() or not manager_metadata_src.is_file():
              raise SystemExit("KernelSU Next manager download step did not produce required files")
          manager_dir = asset_root / "manager"
          manager_dir.mkdir(parents=True, exist_ok=True)
          shutil.copy2(manager_src, manager_dir / "KernelSU-Next.apk")
          shutil.copy2(manager_metadata_src, manager_dir / "manager.json")
          manager_metadata = json.loads(manager_metadata_src.read_text(encoding="utf-8"))

          (asset_root / "artifact-index.json").write_text(
              json.dumps({
                  "mode": "offline",
                  "profileCount": len(manifest["payloads"]),
                  "artifactCount": len(copied),
                  "bundledPayloadBytes": sum(copied.values()),
                  "artifacts": copied,
                  "kernelSuNextManager": manager_metadata,
              }, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          gradle = app / "app" / "build.gradle.kts"
          g = gradle.read_text(encoding="utf-8")
          g = re.sub(
              r'applicationId\s*=\s*"dev\.busung\.s25uroot"',
              'applicationId = "dev.busung.s25uroot.offline"',
              g,
              count=1,
          )
          g = re.sub(
              r'versionName\s*=\s*"([^"]+)"',
              lambda m: f'versionName = "{m.group(1)}-offline-ksunext"',
              g,
              count=1,
          )
          gradle.write_text(g, encoding="utf-8")

          android_manifest = app / "app" / "src" / "main" / "AndroidManifest.xml"
          a = android_manifest.read_text(encoding="utf-8")
          a = re.sub(
              r'\s*<uses-permission android:name="android\.permission\.INTERNET"\s*/>\s*',
              "\n",
              a,
              count=1,
          )
          a = a.replace(
              '<package android:name="me.weishu.kernelsu" />',
              '<package android:name="com.rifsxd.ksunext" />',
          )
          android_manifest.write_text(a, encoding="utf-8")

          repo = app / "app" / "src" / "main" / "java" / "dev" / "busung" / "s25uroot" / "PayloadRepository.kt"
          repo.write_text(r'''package dev.busung.s25uroot

          import android.content.Context
          import android.system.Os
          import java.io.File
          import java.io.FileOutputStream

          data class VerifiedPayloads(
              val profile: TargetProfile,
              val exploit: File,
              val kernelSu: File,
          )

          class PayloadRepository(private val context: Context) {
              fun loadTargets(): List<TargetProfile> {
                  val bytes = context.assets.open(MANIFEST_ASSET).use { it.readBytes() }
                  return SupportManifest.parse(bytes).targets
              }

              fun resolveTarget(snapshot: DeviceSnapshot): TargetProfile = loadTargets()
                  .firstOrNull { it.matches(snapshot) }
                  ?: error(context.getString(R.string.repo_no_profile))

              fun resolveTarget(profileId: String): TargetProfile = loadTargets()
                  .firstOrNull { it.profileId == profileId }
                  ?: error(context.getString(R.string.repo_profile_missing, profileId))

              fun download(profile: TargetProfile, onProgress: (String) -> Unit): VerifiedPayloads {
                  val directory = File(context.filesDir, "payloads/${profile.profileId}").apply { mkdirs() }
                  val exploit = extractArtifact(
                      profile.exploit,
                      File(directory, "cve-2026-43499-app.so"),
                      context.getString(R.string.artifact_exploit),
                      onProgress,
                  )
                  val kernelSu = extractArtifact(
                      profile.kernelSu,
                      File(directory, "ksud-s25u-kdp"),
                      context.getString(R.string.artifact_kernelsu),
                      onProgress,
                  )
                  Os.chmod(exploit.absolutePath, 0b100100100)
                  Os.chmod(kernelSu.absolutePath, 0b100100100)
                  return VerifiedPayloads(profile, exploit, kernelSu)
              }

              private fun extractArtifact(
                  artifact: RemoteArtifact,
                  destination: File,
                  label: String,
                  onProgress: (String) -> Unit,
              ): File {
                  onProgress("Loading bundled $label")
                  val temporary = File(destination.parentFile, "${destination.name}.part")
                  if (temporary.exists()) temporary.delete()

                  var total = 0L
                  context.assets.open(assetPath(artifact.url)).use { input ->
                      FileOutputStream(temporary).use { output ->
                          val buffer = ByteArray(DEFAULT_BUFFER_SIZE)
                          while (true) {
                              val count = input.read(buffer)
                              if (count < 0) break
                              total += count
                              require(total <= artifact.size) {
                                  context.getString(R.string.repo_size_exceeded, label)
                              }
                              output.write(buffer, 0, count)
                          }
                          output.fd.sync()
                      }
                  }

                  require(total == artifact.size) {
                      context.getString(R.string.repo_incomplete, label)
                  }
                  if (destination.exists()) destination.delete()
                  require(temporary.renameTo(destination)) {
                      context.getString(R.string.repo_finalize_failed, label)
                  }
                  onProgress(context.getString(R.string.repo_verified, label))
                  return destination
              }

              private fun assetPath(url: String): String {
                  require(url.startsWith(SOURCE_PREFIX)) {
                      context.getString(R.string.repo_url_invalid)
                  }
                  val relative = url.removePrefix(SOURCE_PREFIX)
                  require(relative.isNotBlank() && relative.split('/').none { it == ".." }) {
                      context.getString(R.string.repo_url_invalid)
                  }
                  return "offline/$relative"
              }

              companion object {
                  private const val MANIFEST_ASSET = "offline/support/targets-v3.json"
                  private const val SOURCE_PREFIX =
                      "https://raw.githubusercontent.com/gamer765/Root-My-Galaxy-Payloads/main/"
              }
          }
          '''.replace("          ", ""), encoding="utf-8")

          updater = app / "app" / "src" / "main" / "java" / "dev" / "busung" / "s25uroot" / "AppUpdater.kt"
          updater.write_text(r'''package dev.busung.s25uroot

          import android.content.Context
          import android.content.Intent
          import android.net.Uri
          import java.io.File

          data class UpdateInfo(
              val versionName: String,
              val apkUrl: String?,
              val releaseUrl: String,
          )

          const val ROOT_MY_GALAXY_URL = "https://github.com/BuSung-dev/Root-My-Galaxy"

          object AppUpdater {
              suspend fun fetchLatestRelease(): UpdateInfo = UpdateInfo(
                  versionName = BuildConfig.VERSION_NAME,
                  apkUrl = null,
                  releaseUrl = ROOT_MY_GALAXY_URL,
              )

              fun isUpdateAvailable(latestVersion: String, currentVersion: String): Boolean = false

              suspend fun downloadApk(
                  context: Context,
                  url: String,
                  onProgress: (Float) -> Unit = {},
              ): File? = null

              fun installApk(context: Context, apk: File): Boolean = false

              fun openReleasesPage(context: Context) {
                  context.startActivity(Intent(Intent.ACTION_VIEW, Uri.parse(ROOT_MY_GALAXY_URL)))
              }
          }
          '''.replace("          ", ""), encoding="utf-8")

          main_activity = app / "app" / "src" / "main" / "java" / "dev" / "busung" / "s25uroot" / "MainActivity.kt"
          m = main_activity.read_text(encoding="utf-8")
          old_constants = '''private const val KERNEL_SU_MANAGER_URL =
              "https://github.com/tiann/KernelSU/releases/download/v3.2.5/KernelSU_v3.2.5_32525-release.apk"
          private const val KERNEL_SU_MANAGER_PACKAGE = "me.weishu.kernelsu"
          private const val KERNEL_SU_HOME_URL = "https://kernelsu.org/"'''.replace("          ", "")
          new_constants = '''private const val KERNEL_SU_MANAGER_PACKAGE = "com.rifsxd.ksunext"
          private const val KERNEL_SU_MANAGER_ASSET = "offline/manager/KernelSU-Next.apk"
          private const val KERNEL_SU_HOME_URL = "https://kernelsu-next.github.io/webpage/"'''.replace("          ", "")
          if old_constants not in m:
              raise SystemExit("Could not locate upstream KernelSU manager constants")
          m = m.replace(old_constants, new_constants, 1)

          old_manager_function = '''private fun openKernelSuManager(context: Context) {
              val launch = context.packageManager.getLaunchIntentForPackage(KERNEL_SU_MANAGER_PACKAGE)
              if (launch != null) {
                  context.startActivity(launch)
              } else {
                  context.startActivity(Intent(Intent.ACTION_VIEW, Uri.parse(KERNEL_SU_MANAGER_URL)))
              }
          }'''.replace("          ", "")
          new_manager_function = '''private fun openKernelSuManager(context: Context) {
              val launch = context.packageManager.getLaunchIntentForPackage(KERNEL_SU_MANAGER_PACKAGE)
              if (launch != null) {
                  context.startActivity(launch)
                  return
              }

              try {
                  val directory = java.io.File(context.cacheDir, "updates").apply { mkdirs() }
                  val apk = java.io.File(directory, "KernelSU-Next.apk")
                  context.assets.open(KERNEL_SU_MANAGER_ASSET).use { input ->
                      apk.outputStream().use { output -> input.copyTo(output) }
                  }
                  val uri = androidx.core.content.FileProvider.getUriForFile(
                      context,
                      "${context.packageName}.fileprovider",
                      apk,
                  )
                  context.startActivity(
                      Intent(Intent.ACTION_VIEW).apply {
                          setDataAndType(uri, "application/vnd.android.package-archive")
                          addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                      },
                  )
              } catch (error: Throwable) {
                  Toast.makeText(
                      context,
                      "Unable to install bundled KernelSU Next manager: ${error.message ?: error.javaClass.simpleName}",
                      Toast.LENGTH_LONG,
                  ).show()
              }
          }'''.replace("          ", "")
          if old_manager_function not in m:
              raise SystemExit("Could not locate upstream KernelSU manager launcher")
          m = m.replace(old_manager_function, new_manager_function, 1)
          main_activity.write_text(m, encoding="utf-8")

          strings = app / "app" / "src" / "main" / "res" / "values" / "strings.xml"
          s = strings.read_text(encoding="utf-8")
          replacements = {
              '<string name="app_name">Root My Galaxy</string>': '<string name="app_name">Root My Galaxy Offline</string>',
              'The app will verify the support profile, then download and run the exploit and KernelSU payload from GitHub.': 'The app will verify the support profile, then load and run the exploit and KernelSU payload bundled inside this APK.',
              '<string name="step_download_title">Download</string>': '<string name="step_download_title">Payloads</string>',
              '<string name="step_download_detail">Load the support manifest</string>': '<string name="step_download_detail">Load bundled manifest and payloads</string>',
              '<string name="phase_downloading">Downloading commit-pinned payloads from GitHub</string>': '<string name="phase_downloading">Loading bundled offline payloads</string>',
              '<string name="status_checking_github">Checking GitHub support manifest</string>': '<string name="status_checking_github">Checking bundled support manifest</string>',
              '<string name="status_downloading_payload">Downloading payloads</string>': '<string name="status_downloading_payload">Loading bundled payloads</string>',
              '<string name="log_download_verified">[+] Payload download complete</string>': '<string name="log_download_verified">[+] Bundled payload verified</string>',
              '<string name="repo_downloading">Downloading %1$s</string>': '<string name="repo_downloading">Loading bundled %1$s</string>',
              '<string name="repo_incomplete">%1$s download is incomplete</string>': '<string name="repo_incomplete">Bundled %1$s is incomplete</string>',
              '<string name="updater_check">Check for updates</string>': '<string name="updater_check">Offline build</string>',
              'Tap to install KernelSU Manager': 'Tap to install KernelSU Next Manager',
              'Tap to open KernelSU Manager': 'Tap to open KernelSU Next Manager',
          }
          for old, new in replacements.items():
              s = s.replace(old, new)
          strings.write_text(s, encoding="utf-8")

          print(f"Profiles: {len(manifest['payloads'])}")
          print(f"Unique bundled payload artifacts: {len(copied)}")
          print(f"Bundled payload bytes: {sum(copied.values())}")
          print(f"KernelSU Next manager: {manager_metadata['release']} / {manager_metadata['asset']}")
          PY

          PAYLOAD_COMMIT="$(git -C payloads rev-parse HEAD)"
          APP_COMMIT="$(git -C appsrc rev-parse HEAD)"
          printf 'payload_repo=gamer765/Root-My-Galaxy-Payloads@%s\nupstream_app=BuSung-dev/Root-My-Galaxy@%s\n' \
            "$PAYLOAD_COMMIT" "$APP_COMMIT" \
            > appsrc/app/src/main/assets/offline/source-commits.txt

          ! grep -q 'android.permission.INTERNET' appsrc/app/src/main/AndroidManifest.xml
          grep -q 'dev.busung.s25uroot.offline' appsrc/app/build.gradle.kts
          grep -q 'com.rifsxd.ksunext' appsrc/app/src/main/AndroidManifest.xml
          test -s appsrc/app/src/main/assets/offline/manager/KernelSU-Next.apk

      - name: Build debug APK
        working-directory: appsrc
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK is fully offline
        shell: bash
        run: |
          set -euo pipefail
          APK="appsrc/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          if apkanalyzer manifest permissions "$APK" | grep -q 'android.permission.INTERNET'; then
            echo "ERROR: INTERNET permission is present in final APK"
            exit 1
          fi
          unzip -l "$APK" | grep -q 'assets/offline/manager/KernelSU-Next.apk'
          unzip -l "$APK" | grep -q 'assets/offline/support/targets-v3.json'
          echo "Verified: no INTERNET permission; payloads and KernelSU Next manager are bundled"

      - name: Package output
        shell: bash
        run: |
          set -euo pipefail
          PAYLOAD_SHA="$(git -C payloads rev-parse --short=12 HEAD)"
          APP_SHA="$(git -C appsrc rev-parse --short=12 HEAD)"
          MANAGER_RELEASE="$(python3 -c 'import json; print(json.load(open("payloads/.offline-manager/manager.json"))["release"])')"
          mkdir -p dist
          cp appsrc/app/build/outputs/apk/debug/app-debug.apk \
            "dist/Root-My-Galaxy-Offline-KSUNext-${PAYLOAD_SHA}.apk"
          cp appsrc/app/src/main/assets/offline/artifact-index.json dist/artifact-index.json
          cp payloads/.offline-manager/manager.json dist/kernelsu-next-manager.json
          printf 'payload_repo_commit=%s\nupstream_app_commit=%s\nkernelsu_next_manager=%s\n' \
            "$PAYLOAD_SHA" "$APP_SHA" "$MANAGER_RELEASE" > dist/BUILD-INFO.txt
          sha256sum dist/*.apk > dist/SHA256SUMS.txt
          cat dist/BUILD-INFO.txt
          cat dist/SHA256SUMS.txt

      - name: Upload offline APK
        uses: actions/upload-artifact@v4
        with:
          name: Root-My-Galaxy-Offline-KSUNext
          path: dist/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
