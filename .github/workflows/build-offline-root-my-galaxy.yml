name: Build Offline Root My Galaxy

on:
  push:
    branches:
      - offline-app-build
    paths:
      - '.github/workflows/build-offline-root-my-galaxy.yml'
      - 'offline-app/**'
      - 'support/targets-v3.json'
      - 'artifacts/**'
      - 'kernelsu/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: root-my-galaxy-offline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout payload repository
        uses: actions/checkout@v4
        with:
          path: payloads

      - name: Checkout Root My Galaxy upstream
        uses: actions/checkout@v4
        with:
          repository: BuSung-dev/Root-My-Galaxy
          ref: main
          path: appsrc

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: appsrc/**/*.gradle*

      - name: Install Android build packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            'platform-tools' \
            'platforms;android-37' \
            'build-tools;37.0.0' \
            'cmake;3.22.1' \
            'ndk;28.2.13676358'

      - name: Prepare fully offline source tree
        shell: bash
        run: |
          set -euo pipefail
          python3 payloads/offline-app/prepare_offline_build.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('appsrc/app/build.gradle.kts')
          s = p.read_text(encoding='utf-8')
          if 'ndkVersion = "28.2.13676358"' not in s:
              s = s.replace('compileSdk = 37', 'compileSdk = 37\n    ndkVersion = "28.2.13676358"', 1)
          p.write_text(s, encoding='utf-8')
          PY
          ! grep -q 'android.permission.INTERNET' appsrc/app/src/main/AndroidManifest.xml
          ! grep -q 'android.permission.REQUEST_INSTALL_PACKAGES' appsrc/app/src/main/AndroidManifest.xml
          ! grep -q 'HttpURLConnection\|java.net.URL' appsrc/app/src/main/java/dev/busung/s25uroot/PayloadRepository.kt
          test -f appsrc/app/src/main/assets/offline/artifact-index.json
          head -40 appsrc/app/src/main/assets/offline/artifact-index.json

      - name: Build debug APK
        working-directory: appsrc
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Package outputs
        shell: bash
        run: |
          set -euo pipefail
          PAYLOAD_COMMIT="$(git -C payloads rev-parse --short=12 HEAD)"
          APP_COMMIT="$(git -C appsrc rev-parse --short=12 HEAD)"
          mkdir -p dist
          cp appsrc/app/build/outputs/apk/debug/app-debug.apk "dist/Root-My-Galaxy-Offline-${PAYLOAD_COMMIT}.apk"
          cp appsrc/app/src/main/assets/offline/artifact-index.json dist/artifact-index.json
          printf 'payload_repo_commit=%s\nupstream_app_commit=%s\npackage_id=com.gamer765.rootmygalaxy.offline\n' \
            "$PAYLOAD_COMMIT" "$APP_COMMIT" > dist/BUILD-INFO.txt
          sha256sum dist/Root-My-Galaxy-Offline-*.apk > dist/SHA256SUMS.txt
          cat dist/BUILD-INFO.txt
          cat dist/SHA256SUMS.txt

      - name: Upload offline APK
        uses: actions/upload-artifact@v4
        with:
          name: Root-My-Galaxy-Offline
          path: dist/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
